name: Quality

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install
      - name: Typecheck
        run: |
          set +e
          bun run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=TypeScript::$line"
            done < /tmp/typecheck.log
          fi
          exit "$status"
      - run: bun run build
